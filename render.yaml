services:
  - type: web
    name: dr-vazirian-vet
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev --no-audit --no-fund && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
      - key: NODE_ENV
        value: production
      - key: ADMIN_EMAIL
        value: golozarbehnood@gmail.com
      - key: ADMIN_PASSWORD
        generateValue: true
